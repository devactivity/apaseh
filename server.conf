# Apaseh configuration file

# basic server settings
port=7888
worker_processes=4
root=./static

# logging
log=./logs/access.log

# connection settings
max_connections=100000
keep_alive_timeout=120
send_timeout=60
client_max_body_size=1048576
worker_connections=1024

# perfomance settings
cache_size=104857600
cache_ttl=3600
sendfile=true
tcp_nodelay=true
tcp_nopush=false
backlog=65536

# reverse proxy settings
proxy_timeout=30

# proxy rules (format: path_prefix=backend_url,strip_prefix=true/false,custom_header=value)
# proxy all /api/ requsets to localhost:3000 and strip the /api prefix
proxy=/api/=http://localhost:3000,strip_prefix=true
